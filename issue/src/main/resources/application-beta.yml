profile-name : beta
# java -jar -Dspring.profiles.active=local issue-0.0.1-SNAPSHOT.jar

spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/voa
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  sql:
    init:
      mode: never # DB 최초 구축 시에만 always로 변경

  jpa:
    hibernate:
      ddl-auto: none # create / update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

  servlet:
    multipart:
      enabled: true # 파일 업로드 가능 여부
      location: C:\\upload\

# HS512 알고리즘을 사용할 것이기 때문에 512bit, 즉 64byte 이상의 secret key가 필요
jwt:
  secret: c2lsdmVybmluZS10ZWNoLXNwcmluZy1ib290LWp3dC10dXRvcmlhbC1zZWNyZXQtc2lsdmVybmluZS10ZWNoLXNwcmluZy1ib290LWp3dC10dXRvcmlhbC1zZWNyZXQK

# Social Login
oauth:
  naver:
    url: https://nid.naver.com/oauth2.0/authorize # 네이버 로그인 연동 URL 생성
    get-token-url: https://nid.naver.com/oauth2.0/token # 접근 토큰 발급 요청
    get-profile-url: https://openapi.naver.com/v1/nid/me # 접근 토큰을 이용하여 프로필 API 호출
    check-auth: https://openapi.naver.com/v1/nid/verify # 접근 토큰을 이용하여 사용자 허용 프로필 권한 확인
